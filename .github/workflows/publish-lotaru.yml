name: Publish @umudik/lotaru

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - name: Install task-bridge backend
        working-directory: apps/task-bridge/apps/backend
        run: npm ci

      - name: Install cloud-platform
        working-directory: apps/cloud-platform
        run: npm ci

      - name: Install cli
        working-directory: packages/cli
        run: npm ci

      - name: Build publish bundle
        run: node apps/cloud-platform/scripts/build-publish.mjs

      - name: Publish
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "whoami=$(npm whoami)"
          npm publish --access public
          sleep 5
          npm view @umudik/lotaru version
          npm view @umudik/lotaru bin
